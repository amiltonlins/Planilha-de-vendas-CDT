name: Aplicar correção vendedor ativo no ranking
on:
  push:
    branches:
      - fix/gestao-vendedores-dinamicos
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gestao-vendedores-dinamicos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/fix_vendedor_ativo_ranking.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Corrigir exibição de vendedor ativo no ranking [skip ci]"
          git push
