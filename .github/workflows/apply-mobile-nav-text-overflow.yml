name: Ajustar texto dos botoes mobile
on:
  push:
    branches: [fix/mobile-nav-text-overflow-only]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-text-fit]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-text-overflow-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_nav_text_overflow.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajustar texto interno dos botoes mobile [mobile-text-fit]"
          git push origin HEAD:fix/mobile-nav-text-overflow-only
