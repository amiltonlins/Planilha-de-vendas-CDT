name: Aplicar sessão na navegação interna

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_session_token_navigation.py
      - .github/workflows/aplicar-session-token-navigation.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/patch_session_token_navigation.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Validar assinatura e ranking
        run: |
          python - <<'PY'
          import app
          assert app.ranking_html([{'vendedor':'Teste','equipe':'Equipe Interna','setor':'X','media':2.1,'vendas':10,'projecao':20,'meta_individual':20,'zeros':1,'neo':2,'neo_pct':.2,'base':100,'comissao_proj':200,'bonus_neo_proj':0,'bonus_adim_proj':20,'premio_total':50,'total_variavel_proj':270}],'abc').find('auth=abc')!=-1
          assert hasattr(app,'issue_dashboard_token') and hasattr(app,'validate_dashboard_token')
          PY
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Preservar autenticação na navegação do vendedor [skip ci]"
          git push origin HEAD:main

# trigger 2
