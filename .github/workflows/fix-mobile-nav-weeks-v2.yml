name: Aplicar correcao mobile navegacao semanas v2
on:
  push:
    branches: [fix/mobile-nav-weeks-layout-v2]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-nav-v2-aplicado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-weeks-layout-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_nav_weeks_v2.py
      - run: |
          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir navegacao e semanas no mobile [mobile-nav-v2-aplicado]"
          git push origin HEAD:fix/mobile-nav-weeks-layout-v2
