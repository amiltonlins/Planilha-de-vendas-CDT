name: Aplicar ranking mobile compacto

on:
  push:
    branches:
      - fix/ranking-mobile-compacto-final
    paths:
      - scripts/patch_ranking_mobile_compacto.py
      - .github/workflows/aplicar-ranking-mobile-compacto.yml

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ranking-mobile-compacto-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar patch
        run: python scripts/patch_ranking_mobile_compacto.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar escopo
        run: |
          grep -q 'AJUSTE FINAL — EXCLUSIVAMENTE RANKING MOBILE' app.py
          ! grep -q 'placeholder="Ex.: Magda Alexandra"' app.py
      - name: Commitar app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Compactar ranking somente no mobile [skip ci]"
          git push
