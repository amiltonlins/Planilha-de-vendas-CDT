name: Corrigir corte dos botoes mobile
on:
  push:
    branches: [fix/mobile-nav-button-clipping]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[mobile-nav-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-button-clipping
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_nav_button_clipping.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir corte dos botoes mobile [mobile-nav-fixed]"
          git push origin HEAD:fix/mobile-nav-button-clipping
