name: Executar transferencia relatorio geral

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'move/relatorio-geral-gestao-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar transferencia
        run: python scripts/mover_relatorio_geral_para_gestao_exec.py
      - name: Validar sintaxe e posição
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text=Path('app.py').read_text(encoding='utf-8')
          assert 'management_display=general_report_display(management_team)' in text
          assert 'render_general_report(st,team,rows,cfg,summary,all_days,elapsed,official,color)' not in text
          assert 'gestao_download_relatorio_geral' in text
          print('VALIDAÇÃO OK')
          PY
      - name: Publicar app atualizado na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet app.py; then
            echo "app.py já atualizado"
            exit 0
          fi
          git add -- app.py
          git commit -m "Transferir relatório geral para Gestão"
          git push origin HEAD:${{ github.head_ref }}
