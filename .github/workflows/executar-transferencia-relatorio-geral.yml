name: Executar transferencia relatorio geral

on:
  push:
    branches: [main]
    paths:
      - scripts/mover_relatorio_geral_para_gestao_exec.py
      - .github/workflows/executar-transferencia-relatorio-geral.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar transferencia
        run: python scripts/mover_relatorio_geral_para_gestao_exec.py
      - name: Validar sintaxe e posição
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          text=Path('app.py').read_text(encoding='utf-8')
          assert 'management_display=general_report_display(management_team)' in text
          assert 'render_general_report(st,team,rows,cfg,summary,all_days,elapsed,official,color)' not in text
          assert 'gestao_download_relatorio_geral' in text
          print('VALIDAÇÃO OK')
          PY
      - name: Publicar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -- app.py
          git commit -m "Transferir relatório geral para Gestão"
          git push origin HEAD:main
