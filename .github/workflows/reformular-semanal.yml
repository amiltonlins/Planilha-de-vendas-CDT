name: Reformular semanal
on:
  push:
    branches:
      - fix/semanal-mobile-ranking
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semanal-mobile-ranking
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar reformulação semanal
        run: python scripts/reformular_semanal.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Reformular aba semanal [skip ci]"
          git push