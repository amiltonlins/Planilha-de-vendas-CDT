name: Aplicar seletor semanal mobile compacto

on:
  push:
    branches:
      - fix/semanas-mobile-compacto-20260824
    paths:
      - scripts/compactar_semanas_mobile.py
      - .github/workflows/aplicar-semanas-mobile-compacto.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semanas-mobile-compacto-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/compactar_semanas_mobile.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar escopo mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('app.py').read_text(encoding='utf-8')
          assert 'SELETOR SEMANAL MOBILE ULTRACOMPACTO' in text
          assert 'gap:2px!important' in text
          assert 'content:"S1"' in text and 'content:"S6"' in text
          assert '@media(max-width:700px)' in text
          print('Validação do seletor semanal mobile OK')
          PY
      - name: Commitar app atualizado
        run: |
          if git diff --quiet app.py; then
            echo "Sem alteracoes em app.py"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -- app.py
          git commit -m "Compactar seletor semanal no mobile"
          git push origin HEAD:fix/semanas-mobile-compacto-20260824
