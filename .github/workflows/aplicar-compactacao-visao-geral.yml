name: Aplicar compactacao visual da Visao Geral
on:
  push:
    branches:
      - feat/compactar-visao-geral
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compactar-visao-geral
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar ajuste visual
        run: python scripts/aplicar_compactacao_visao_geral.py
      - name: Validar
        run: |
          python -m py_compile app.py gerar_painel.py
          grep -Fq 'exec-compact-grid' app.py
          grep -Fq 'DESEMPENHO DE VENDAS' app.py
          grep -Fq 'perf-section-compact' app.py
          if grep -Fq 'Resultado atual' app.py; then exit 1; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Compactar indicadores da Visao Geral'
            git push
          fi
