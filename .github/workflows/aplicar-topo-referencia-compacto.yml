name: Aplicar topo referencia compacto
on:
  push:
    branches:
      - feat/topo-referencia-compacto
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[topo-aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topo-referencia-compacto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/aplicar_topo_referencia_compacto.py
      - run: python -m py_compile app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar topo compacto conforme referencia [topo-aplicado]"
          git push
