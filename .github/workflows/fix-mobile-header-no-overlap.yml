name: Corrigir header mobile sem sobreposicao
on:
  push:
    branches: [fix/mobile-header-no-overlap]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-header-ok]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-header-no-overlap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_header_no_overlap.py
      - run: |
          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir layout mobile do header sem sobreposicao [mobile-header-ok]"
          git push origin HEAD:fix/mobile-header-no-overlap
