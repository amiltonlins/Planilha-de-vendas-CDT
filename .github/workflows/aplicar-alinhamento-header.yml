name: Aplicar alinhamento mobile do header
on:
  push:
    branches: [fix/mobile-header-alignment-update-time]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[header-mobile-aplicado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-header-alignment-update-time
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/aplicar_alinhamento_header.py
      - run: |
          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Alinhar controles mobile e corrigir horario de atualizacao [header-mobile-aplicado]"
          git push origin HEAD:fix/mobile-header-alignment-update-time
