name: Aplicar layout exato da referencia
on:
  push:
    branches:
      - feat/layout-exato-referencia
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[layout-aplicado]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/layout-exato-referencia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/aplicar_layout_referencia_exata.py
      - run: python -m py_compile app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar layout da referencia [layout-aplicado]"
          git push