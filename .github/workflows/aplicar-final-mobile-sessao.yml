name: Aplicar final mobile e sessão

on:
  push:
    branches: [fix/final-mobile-sessao-overflow]
    paths:
      - scripts/patch_final_mobile_sessao.py
      - .github/workflows/aplicar-final-mobile-sessao.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-mobile-sessao-overflow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Salvar ranking desktop original
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          s=Path('app.py').read_text(encoding='utf-8')
          m=re.search(r'def ranking_html\(ranking,auth_token=""\):.*?\ndef daily_series',s,re.S)
          assert m
          Path('/tmp/ranking_hash').write_text(hashlib.sha256(m.group(0).encode()).hexdigest())
          PY
      - name: Aplicar patch
        run: python scripts/patch_final_mobile_sessao.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Validar requisitos críticos
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          import app
          s=Path('app.py').read_text(encoding='utf-8')
          m=re.search(r'def ranking_html\(ranking,auth_token=""\):.*?\ndef daily_series',s,re.S)
          assert m and hashlib.sha256(m.group(0).encode()).hexdigest()==Path('/tmp/ranking_hash').read_text(), 'ranking desktop foi alterado'
          assert app.TEAM_OPTIONS==('Equipe Interna','Equipe Externa','Outros Canais')
          assert 'ranking_team_filter' in s and 'selectbox("Equipe",TEAM_OPTIONS' in s
          assert 'issue_dashboard_token' in s and 'validate_dashboard_token' in s
          assert 'logout_href=' in s and '&action=logout' in s
          assert 'rank-inside>span:nth-child(1)' in s
          assert 'rank-inside>span:nth-child(13)' in s
          assert 'overflow-x:visible!important' not in s
          assert 'width:calc(100vw - 16px)!important' in s
          assert 'Eles ficam em OUTROS CANAIS' in s
          PY
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Finalizar mobile, overflow e sessão autenticada [skip ci]"
          git push origin HEAD:fix/final-mobile-sessao-overflow
