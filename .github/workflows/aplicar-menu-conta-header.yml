name: Aplicar menu de conta no header
on:
  push:
    branches:
      - feat/header-conta-integrada
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/header-conta-integrada
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar ajuste
        run: python scripts/aplicar_menu_conta_header.py
      - name: Validar
        run: |
          python -m py_compile app.py gerar_painel.py
          grep -Fq 'account_label=f"◉ {user_name_raw}  ▾"' app.py
          grep -Fq 'header_account=st.columns' app.py
          if grep -Fq 'with st.popover("⋮"' app.py; then exit 1; fi
          if grep -Fq 'cdt-session-name' app.py | grep -Fq 'user_name'; then exit 1; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Agrupar usuário, Gestão e Sair no cabeçalho'
            git push
          fi
