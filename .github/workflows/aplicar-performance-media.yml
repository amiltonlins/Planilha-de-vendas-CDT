name: Aplicar performance por media

on:
  push:
    branches:
      - feat/comissao-ranking-ajustes
    paths:
      - scripts/ajustar_performance_media.py
      - .github/workflows/aplicar-performance-media.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comissao-ranking-ajustes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajustes
        run: python scripts/ajustar_performance_media.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          python -m py_compile gerar_painel.py
      - name: Commitar arquivos gerados
        run: |
          if git diff --quiet app.py gerar_painel.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add app.py gerar_painel.py
          git commit -m "Ajustar performance visual por média diária"
          git push origin HEAD:feat/comissao-ranking-ajustes
