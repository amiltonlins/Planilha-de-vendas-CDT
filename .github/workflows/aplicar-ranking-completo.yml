name: Aplicar reorganização executiva BI

on:
  push:
    branches:
      - feat/ranking-completo-vendedores
    paths:
      - .github/workflows/aplicar-ranking-completo.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'feat/ranking-completo-vendedores'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ranking-completo-vendedores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alterações
        run: |
          python scripts/patch_exec_bi.py
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("st.markdown('<div class=\"section\">Relatório geral da equipe</div>'',unsafe_allow_html=True)","st.markdown('<div class=\"section\">Relatório geral da equipe</div>',unsafe_allow_html=True)")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          python -m py_compile gerar_painel.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py gerar_painel.py
          git diff --cached --quiet || git commit -m "Reorganizar painel executivo e premiações [skip ci]"
          git push origin HEAD:feat/ranking-completo-vendedores
