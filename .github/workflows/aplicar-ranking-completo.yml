name: Aplicar ranking completo

on:
  push:
    branches:
      - feat/ranking-completo-vendedores
    paths:
      - .github/workflows/aplicar-ranking-completo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ranking-completo-vendedores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alterações
        run: python scripts/patch_ranking_completo.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Atualiza ranking completo e move relatório geral [skip ci]"
          git push origin HEAD:feat/ranking-completo-vendedores
