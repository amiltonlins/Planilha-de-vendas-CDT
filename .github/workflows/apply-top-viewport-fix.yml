name: Aplicar correção definitiva do topo
on:
  push:
    branches: [fix/top-viewport-real]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[top-viewport-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-viewport-real
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_top_viewport_fix.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar correção definitiva do topo [top-viewport-fix]"
          git push origin HEAD:fix/top-viewport-real
