name: Aplicar menu na barra superior

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_menu_barra.py
      - .github/workflows/aplicar-menu-barra.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alteração visual
        run: python scripts/patch_menu_barra.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Integrar navegação à barra superior [skip ci]"
          git push origin HEAD:main
