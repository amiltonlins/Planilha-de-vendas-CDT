name: Aplicar ajustes mobile e canais

on:
  push:
    branches:
      - feat/ajustes-mobile-canais-performance
    paths:
      - scripts/patch_mobile_canais_performance.py
      - .github/workflows/aplicar-ajustes-mobile-canais.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ajustes-mobile-canais-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alterações
        run: python scripts/patch_mobile_canais_performance.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Ajustar performance, canais e ranking mobile [skip ci]"
          git push origin HEAD:feat/ajustes-mobile-canais-performance
