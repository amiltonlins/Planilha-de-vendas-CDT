name: Corrigir navegação na mesma página

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_menu_same_page.py
      - .github/workflows/aplicar-menu-same-page.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/patch_menu_same_page.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Corrigir navegação superior na mesma página [skip ci]"
          git push origin HEAD:main
