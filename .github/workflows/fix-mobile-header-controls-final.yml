name: Corrigir responsividade dos controles mobile
on:
  push:
    branches: [fix/mobile-header-controls-final]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-controls-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-header-controls-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_header_controls_final.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir causa da quebra mobile [mobile-controls-fixed]"
          git push origin HEAD:fix/mobile-header-controls-final
