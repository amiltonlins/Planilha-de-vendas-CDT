name: Aplicar modal mobile e autenticação v2

on:
  push:
    branches: [feat/mobile-dialog-auth-v2]
    paths:
      - scripts/patch_mobile_dialog_auth_v2.py
      - .github/workflows/aplicar-mobile-dialog-auth-v2.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-dialog-auth-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/patch_mobile_dialog_auth_v2.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Validar autenticação por dois nomes
        run: |
          python - <<'PY'
          import app
          cfg={'vendedores':[{'vendedor':'MAGDA ALEXANDRA DA SILVA','ativo':True}]}
          for supplied in ('Hamilton Lins','Amilton Lins','Sheila Santos','Sheyla Santos','Joyce Larissa','Joice Larissa','Rafael Salgado','Raphael Salgado'):
              user,status=app.authenticate_dashboard_name(cfg,supplied)
              assert status=='ok',(supplied,status)
          assert app.authenticate_dashboard_name(cfg,'Magda Alexandra')[1]=='ok'
          assert app.authenticate_dashboard_name(cfg,'Magda')[1]=='invalid'
          assert app.authenticate_dashboard_name(cfg,'Pessoa Inexistente')[1]=='invalid'
          assert hasattr(app,'is_mobile_client')
          PY
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Compactar modal mobile e ajustar autenticação [skip ci]"
          git push origin HEAD:feat/mobile-dialog-auth-v2
