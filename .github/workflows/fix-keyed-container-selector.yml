name: Corrigir seletor do container chaveado
on:
  push:
    branches: [fix/mobile-header-controls-final]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[keyed-selector-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-header-controls-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_keyed_container_selector.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir seletor do container chaveado [keyed-selector-fixed]"
          git push origin HEAD:fix/mobile-header-controls-final
