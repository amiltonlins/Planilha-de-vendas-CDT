name: Aplicar ajustes canais dialog relatorios
on:
  push:
    branches:
      - fix/ajustes-canais-dialog-relatorios
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ajustes-canais-dialog-relatorios
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alterações
        run: python scripts/fix_channels_dialog_reports.py
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar sintaxe e XLSX
        run: |
          python -m py_compile app.py gerar_painel.py calendario_feriados.py
          python - <<'PY'
          import io
          from openpyxl import load_workbook
          import app
          sample=[{"equipe":"Equipe Interna","vendedor":"TESTE","vendas":10,"projecao":20,"media":2.0,"zeros":0,"meta_individual":40,"neo":3,"neo_pct":.3,"base":100.0,"comissao_proj":200.0,"bonus_neo_proj":30.0,"bonus_adim_proj":20.0,"premio_total":50.0,"total_variavel_proj":300.0,"dias_decorridos":{1},"diario":{1:2}}]
          from datetime import date
          data=app.general_report_xlsx_bytes(sample,[date(2026,8,1),date(2026,8,2)])
          wb=load_workbook(io.BytesIO(data),read_only=True,data_only=True)
          assert wb.sheetnames==["RELATORIO GERAL"]
          assert wb["RELATORIO GERAL"]["C2"].value==10
          wb.close()
          print('XLSX válido')
          PY
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py requirements.txt
          git diff --cached --quiet || git commit -m "Ajustar canais popup e relatórios [skip ci]"
          git push
