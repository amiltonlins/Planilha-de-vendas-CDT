name: Mover Premiações para Gestão
on:
  push:
    branches:
      - fix/premiacoes-somente-gestao
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premiacoes-somente-gestao
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar alteração
        run: python scripts/mover_premiacoes_gestao.py
      - name: Validar
        run: |
          python -m py_compile app.py gerar_painel.py
          grep -Fq 'areas=["VISÃO GERAL","SEMANAL"]' app.py
          grep -Fq '#### PREMIAÇÕES E CENÁRIOS' app.py
          if grep -Fq 'elif area=="PREMIAÇÕES"' app.py; then exit 1; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Mover Premiações para área gerencial'
            git push
          fi
