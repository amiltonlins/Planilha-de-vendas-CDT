name: Aplicar ajuste do espaco superior
on:
  push:
    branches: [fix/top-empty-space-desktop-mobile]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[top-space-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-empty-space-desktop-mobile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_top_empty_space_fix.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remover espaco vazio superior [top-space-fix]"
          git push origin HEAD:fix/top-empty-space-desktop-mobile
