name: Aplicar exclusão de importações
on:
  push:
    branches:
      - feat/excluir-importacoes
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/excluir-importacoes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/patch_excluir_importacoes.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Implementar exclusão persistente de importações [skip ci]"
          git push
