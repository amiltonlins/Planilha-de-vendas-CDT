name: Aplicar acabamento final do painel

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_final_polish.py
      - .github/workflows/aplicar-final-polish.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar acabamento
        run: python scripts/patch_final_polish.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Validar nomenclatura de equipes
        run: |
          python - <<'PY'
          import app
          assert app.TEAM_OPTIONS == ('Equipe Interna','Equipe Externa','Outros Canais')
          assert app.normalized_team('PAP',{'setor':'PAP'})=='Equipe Externa'
          assert app.normalized_team('DIGITAL',{'setor':'DIGITAL'})=='Equipe Interna'
          PY
      - name: Commitar acabamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Finalizar equipes e responsividade do painel [skip ci]"
          git push origin HEAD:main
