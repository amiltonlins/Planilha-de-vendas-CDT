name: Apply BI UI

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_producao_canal_compacta.py
      - .github/workflows/apply-bi-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar novo layout de producao por canal
        run: python scripts/apply_producao_canal_compacta.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py calendario_feriados.py
      - name: Commitar app atualizado
        run: |
          if git diff --quiet app.py; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Redesenhar producao por canal"
          git push origin HEAD:main
