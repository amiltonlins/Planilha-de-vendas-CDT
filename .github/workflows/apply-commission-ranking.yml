name: Apply commission and ranking adjustments

on:
  push:
    branches:
      - feat/comissao-ranking-ajustes
    paths:
      - scripts/apply_commission_ranking_changes.py
      - .github/workflows/apply-commission-ranking.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comissao-ranking-ajustes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply changes
        run: python scripts/apply_commission_ranking_changes.py
      - name: Validate syntax
        run: python -m py_compile app.py gerar_painel.py
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py gerar_painel.py
          git rm scripts/apply_commission_ranking_changes.py .github/workflows/apply-commission-ranking.yml
          git commit -m "Ajustar comissão projetada e ranking da equipe"
          git push origin HEAD:feat/comissao-ranking-ajustes
