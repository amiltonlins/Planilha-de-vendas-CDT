name: Aplicar correção de contagem de vendas
on:
  push:
    branches:
      - fix/contagem-vendas-normalizada
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contagem-vendas-normalizada
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/fix_contagem_vendas.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py gerar_painel.py
          git diff --cached --quiet || git commit -m "Corrigir contagem de vendas por identidade normalizada [skip ci]"
          git push
