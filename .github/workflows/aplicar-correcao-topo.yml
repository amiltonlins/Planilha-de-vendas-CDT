name: Aplicar correcao do espaco superior

on:
  push:
    branches:
      - fix/topo-sem-espaco-vazio
    paths:
      - scripts/corrigir_espaco_topo.py
      - .github/workflows/aplicar-correcao-topo.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/corrigir_espaco_topo.py
      - .github/workflows/aplicar-correcao-topo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/topo-sem-espaco-vazio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correcao estrutural do topo
        run: python scripts/corrigir_espaco_topo.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          python -m py_compile gerar_painel.py
      - name: Commitar app atualizado
        if: github.event_name == 'push'
        run: |
          if git diff --quiet app.py; then
            echo "Sem alteracoes em app.py"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py
          git commit -m "Corrigir espaco vazio no topo do aplicativo"
          git push origin HEAD:fix/topo-sem-espaco-vazio
