name: Aplicar ajuste mobile dos botoes
on:
  push:
    branches: [fix/mobile-nav-button-text-fit]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-nav-fit-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-button-text-fit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_nav_text_fit.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir corte do texto nos botoes mobile [mobile-nav-fit-applied]"
          git push origin HEAD:fix/mobile-nav-button-text-fit
