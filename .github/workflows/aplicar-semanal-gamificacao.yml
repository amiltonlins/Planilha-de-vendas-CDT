name: Aplicar semanal gamificada
on:
  push:
    branches:
      - feat/semanal-gamificacao-gestao
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semanal-gamificacao-gestao
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar alterações
        run: python scripts/aplicar_semanal_gamificacao.py
      - name: Validar sintaxe e regras preservadas
        run: |
          python -m py_compile app.py gerar_painel.py
          python scripts/test_semanal_gamificacao.py
          grep -q 'weekly_rank_gamified_html' app.py
          grep -q 'ACOMPANHAMENTO SEMANAL' app.py
          grep -q 'premiacao_semanal' config.json
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Melhorar semanal com gamificacao e area gerencial'
            git push
          fi
