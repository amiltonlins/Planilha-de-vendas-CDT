name: Aplicar seletor semanal mobile
on:
  push:
    branches:
      - feat/seletor-semanas-mobile-compacto
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seletor-semanas-mobile-compacto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar ajuste visual
        run: python scripts/aplicar_seletor_semanas_mobile.py
      - name: Validar
        run: |
          python -m py_compile app.py gerar_painel.py
          grep -Fq '✓ S' app.py
          grep -Fq 'weekly_week_nav' app.py
          grep -Fq 'ATUAL: S' app.py
          if grep -Fq 'Semana {week_index+1} atual · ranking em andamento' app.py; then exit 1; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Compactar seletor de semanas no mobile'
            git push
          fi
