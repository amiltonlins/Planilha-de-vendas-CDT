name: Aplicar metas por equipe
on:
  push:
    branches:
      - feat/metas-equipe-producao-canal
  pull_request:
    branches:
      - main
jobs:
  aplicar:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/metas-equipe-producao-canal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alteração
        run: python scripts/add_team_goals.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py calendario_feriados.py
      - name: Validar helper de equipe
        run: |
          python - <<'PY'
          import ast
          ast.parse(open('tests/test_team_sales.py',encoding='utf-8').read())
          print('teste de equipe preparado')
          PY
      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py config.json tests/test_team_sales.py
          git diff --cached --quiet || git commit -m "Adicionar metas e produção por equipe [skip ci]"
          git push
