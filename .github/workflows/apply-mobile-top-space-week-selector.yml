name: Aplicar ajuste mobile topo e semanas
on:
  push:
    branches: [fix/mobile-top-space-week-selector]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mobile-top-weeks]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-top-space-week-selector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_mobile_top_space_week_selector.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir topo mobile e seletor de semanas [mobile-top-weeks]"
          git push origin HEAD:fix/mobile-top-space-week-selector
