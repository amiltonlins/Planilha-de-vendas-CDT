name: Ajustar visual producao por canal
on:
  push:
    branches:
      - fix/padronizar-producao-canal
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/padronizar-producao-canal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/ajustar_producao_canal_visual.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Simplificar visual da producao por canal [skip ci]"
          git push
