name: Aplicar emojis de performance

on:
  push:
    branches:
      - fix/emojis-performance-4-niveis
    paths:
      - scripts/ajustar_emojis_performance.py
      - .github/workflows/aplicar-emojis-performance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/emojis-performance-4-niveis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/ajustar_emojis_performance.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          python -m py_compile gerar_painel.py
      - name: Commitar app atualizado
        run: |
          if git diff --quiet app.py; then
            echo "Sem alterações em app.py"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Sincronizar emojis com classificação de performance"
          git push origin HEAD:fix/emojis-performance-4-niveis
