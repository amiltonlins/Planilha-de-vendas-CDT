name: Aplicar correção meta e vendedores ativos
on:
  push:
    branches:
      - fix/restaurar-meta-e-ativos
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restaurar-meta-e-ativos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/fix_meta_e_ativos.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py calendario_feriados.py
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py
          git diff --cached --quiet || git commit -m "Restaurar meta e vendedores ativos [skip ci]"
          git push
