name: Aplicar correcao estrutural navegacao mobile
on:
  push:
    branches: [fix/mobile-nav-buttons-structural]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[nav-estrutural-aplicado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-nav-buttons-structural
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_mobile_nav_buttons_structural.py
      - run: |
          python -m py_compile app.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir botoes mobile de forma estrutural [nav-estrutural-aplicado]"
          git push origin HEAD:fix/mobile-nav-buttons-structural
