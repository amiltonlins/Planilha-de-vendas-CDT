name: Aplicar topo final compacto
on:
  push:
    branches: [feat/topo-final-compacto]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[topo-final-aplicado]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topo-final-compacto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/aplicar_topo_final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajustar topo e indicadores [topo-final-aplicado]"
          git push
