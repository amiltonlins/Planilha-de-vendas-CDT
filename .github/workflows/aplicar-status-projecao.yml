name: Aplicar status visual da projeção

on:
  push:
    branches:
      - feat/ajustes-mobile-canais-performance
    paths:
      - scripts/patch_status_projecao.py
      - .github/workflows/aplicar-status-projecao.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'feat/ajustes-mobile-canais-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ajustes-mobile-canais-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar implementação
        run: python scripts/patch_status_projecao.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar faixas visuais
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('app.py').read_text(encoding='utf-8')
          tree=ast.parse(src)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='projection_status_visual')
          mod=ast.Module(body=[fn],type_ignores=[])
          ns={}
          exec(compile(mod,'<status>','exec'),ns)
          f=ns['projection_status_visual']
          cases=[(.375,'😭','MUITO ABAIXO'),(.50,'😟','ATENÇÃO'),(.75,'😐','PRECISA ACELERAR'),(.85,'🙂','BOM RITMO'),(.95,'😄','QUASE LÁ!'),(1.05,'😎','META NO CAMINHO!'),(1.375,'🤩','VOANDO!')]
          for ratio,emoji,msg in cases:
              assert f(ratio,40,ratio*40)==(emoji,msg)
          assert f(0,None,10)==('🙂','AGUARDANDO DADOS')
          assert f(0,0,10)==('🙂','AGUARDANDO DADOS')
          assert f(0,40,None)==('🙂','AGUARDANDO DADOS')
          PY
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Adicionar status visual da projeção [skip ci]"
          git push origin HEAD:feat/ajustes-mobile-canais-performance
