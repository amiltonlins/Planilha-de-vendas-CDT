name: Aplicar popup executivo do vendedor

on:
  push:
    branches:
      - fix/popup-executivo-vendedor
    paths:
      - scripts/ajustar_popup_vendedor.py
      - .github/workflows/aplicar-popup-executivo-vendedor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/popup-executivo-vendedor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar reorganização do popup
        run: python scripts/ajustar_popup_vendedor.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          python -m py_compile gerar_painel.py
      - name: Commitar app atualizado
        run: |
          if git diff --quiet app.py; then
            echo "Sem alterações em app.py"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Reorganizar popup executivo do vendedor"
          git push origin HEAD:fix/popup-executivo-vendedor
