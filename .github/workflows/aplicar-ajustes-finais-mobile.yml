name: Aplicar ajustes finais mobile, equipes e autenticação

on:
  push:
    branches: [feat/ajustes-finais-mobile-equipes-auth]
    paths:
      - scripts/patch_ajustes_finais_mobile.py
      - .github/workflows/aplicar-ajustes-finais-mobile.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ajustes-finais-mobile-equipes-auth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Registrar assinatura do ranking desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          s=Path('app.py').read_text(encoding='utf-8')
          m=re.search(r'def ranking_html\(ranking\):.*?\ndef daily_series',s,re.S)
          assert m, 'ranking_html não encontrado'
          Path('/tmp/ranking_hash').write_text(hashlib.sha256(m.group(0).encode()).hexdigest())
          PY
      - name: Aplicar patch
        run: python scripts/patch_ajustes_finais_mobile.py
      - name: Validar sintaxe
        run: python -m py_compile app.py gerar_painel.py
      - name: Validar desktop, equipes, autenticação e mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          import app
          s=Path('app.py').read_text(encoding='utf-8')
          m=re.search(r'def ranking_html\(ranking\):.*?\ndef mobile_ranking_metrics_html',s,re.S)
          assert m, 'ranking desktop não encontrado após patch'
          original=Path('/tmp/ranking_hash').read_text()
          desktop_text=m.group(0).rsplit('\ndef mobile_ranking_metrics_html',1)[0]+'\ndef daily_series'
          # O corpo de ranking_html deve permanecer idêntico; apenas o ponto seguinte mudou pela inserção mobile.
          before=re.search(r'def ranking_html\(ranking\):.*?\ndef daily_series',Path('app.py').read_text(encoding='utf-8').replace(m.group(0), desktop_text),re.S)
          assert before
          assert hashlib.sha256(before.group(0).encode()).hexdigest()==original, 'ranking desktop foi alterado'
          assert app.TEAM_OPTIONS==('Equipe Interna','Equipe Externa','Outros Canais')
          cfg={'vendedores':[{'vendedor':'MAGDA ALEXANDRA DA SILVA','ativo':True,'equipe':'Equipe Interna'}]}
          assert app.authenticate_dashboard_name(cfg,'Magda Alexandra')[1]=='ok'
          assert app.authenticate_dashboard_name(cfg,'Magda')[1]=='invalid'
          assert 'def render_mobile_ranking(' in s
          assert 'st.session_state.seller_detail=x["vendedor"]' in s
          assert '?action=management' not in s and '?action=logout' not in s
          assert 'mobile-rank-metrics' in s
          assert 'grid-template-columns:repeat(6,minmax(0,1fr))' in s
          assert 'overflow-x:visible!important' not in s
          assert 'selectbox("Equipe",TEAM_OPTIONS' in s
          assert 'ranking_team_filter' in s
          PY
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Aplicar ajustes finais mobile, equipes e sessão [skip ci]"
          git push origin HEAD:feat/ajustes-finais-mobile-equipes-auth
