name: Aplicar status visual no ranking

on:
  push:
    branches:
      - fix/status-projecao-no-ranking
    paths:
      - scripts/patch_status_ranking.py
      - .github/workflows/aplicar-status-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-projecao-no-ranking
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alteração
        run: python scripts/patch_status_ranking.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commitar app atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Mover status visual da projeção para o ranking [skip ci]"
          git push origin HEAD:fix/status-projecao-no-ranking
